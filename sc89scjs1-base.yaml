# Mihomo-only base for sc89scjs1.ini. Publish both files at the repository root.
# Subconverter supplies proxies/proxy-groups, and preserves this base's rules.
# No subscription credentials here. 10x chaining remains in premium-addon/.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
profile:
  store-selected: true
# ShellCrash normally replaces DNS/ports at startup. No GeoSite/ASN downloads.
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]

